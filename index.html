<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SELAH · Escuela de Música</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a0806">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0806;--s:#16120d;--g:#d9a441;--g2:#f3d48a;--t:#f4ecdc;--m:#a39880;--ok:#3ecf8e;--no:#ff6b5b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:16px/1.6 Jost,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.1;color:var(--g2)}h2{font-size:2.4rem;margin-bottom:1rem}
img{max-width:100%}a{color:var(--g)}
nav{position:fixed;inset:0 0 auto;z-index:9;display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;background:#0a0806d9;backdrop-filter:blur(8px)}
nav img{height:44px}nav span{flex:1}nav a{text-decoration:none;color:var(--t)}
button,.b{white-space:nowrap;background:linear-gradient(135deg,var(--g2),var(--g));color:#1a1206;border:0;border-radius:999px;padding:.6rem 1.3rem;font:500 1rem Jost;cursor:pointer;text-decoration:none;display:inline-block}
button.o{background:none;border:1px solid var(--g);color:var(--g2)}button.x{background:none;color:var(--no);padding:.2rem .6rem}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.hero{height:100vh;min-height:520px;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a1f0d,var(--bg) 70%)}
.hero .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}.hero .sl.on{opacity:.45}
.hero div.c{position:relative;padding:1rem}.hero img{width:min(380px,70vw)}.hero p{color:var(--m);margin:.5rem 0 1.4rem}
section{padding:4rem 1.2rem;max-width:1000px;margin:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.card{background:var(--s);border:1px solid #2c2315;border-radius:10px;padding:1rem;margin:.6rem 0}
input,select,textarea{width:100%;background:#0f0c08;color:var(--t);border:1px solid #3a2e19;border-radius:8px;padding:.6rem;margin:.3rem 0 .8rem;font:inherit}
label.ck{display:inline-flex;gap:.4rem;align-items:center;margin:.2rem .8rem .2rem 0}label.ck input{width:auto;margin:0}
.radio{display:flex;gap:1rem;align-items:center}.radio button{width:64px;height:64px;font-size:1.6rem;padding:0}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:grid;place-items:center;padding:1rem}.modal .card{width:min(380px,100%)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:5rem 0 1rem}.tabs button{padding:.4rem 1rem}.tabs .on{background:var(--g);color:#1a1206}
.big{font-family:'Cormorant Garamond';font-size:3rem;text-align:center;padding:1.5rem;border-radius:14px;font-weight:700}
.big.ok{background:#12261d;color:var(--ok)}.big.pe{background:#2b1512;color:var(--no)}.big.be{background:#2a2110;color:var(--g2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}.av{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}
.mat{min-height:120px;background-size:cover;background-position:center}small{color:var(--m)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
textarea{resize:vertical}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;overflow-wrap:break-word}
h2{font-size:clamp(1.8rem,6vw,2.4rem)}
nav{padding-top:calc(.6rem + env(safe-area-inset-top))}
.hero{height:100vh;height:100svh}.hero h1{font-size:clamp(2.4rem,10vw,4.6rem);text-shadow:0 2px 24px #000}.hero small{letter-spacing:.35em;color:var(--g);display:block;margin-bottom:.8rem;font-size:.8rem}
.hero p{text-shadow:0 1px 12px #000;color:var(--t)}
.glow{animation:pulse 2.2s infinite;font-size:1.1rem;padding:.8rem 1.8rem}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f3d48acc,0 0 14px #d9a44166}70%{box-shadow:0 0 0 20px #f3d48a00,0 0 34px #d9a441aa}100%{box-shadow:0 0 0 0 #f3d48a00,0 0 14px #d9a44166}}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}.pdf .cv{aspect-ratio:3/4;background:#0f0c08 center/cover;border-radius:8px;display:grid;place-items:center;font-size:2.5rem;margin-bottom:.5rem}
.gal{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.radio{flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.glow{animation:none}}
@media(max-width:560px){.ni{display:none}nav{gap:.5rem;padding:.5rem .8rem;padding-top:calc(.5rem + env(safe-area-inset-top))}nav img{height:38px}nav button{padding:.5rem .9rem;font-size:.9rem}section{padding:2.5rem 1rem}.big{font-size:2.2rem;padding:1rem}.tabs{margin-top:5rem}.radio button{width:56px;height:56px}}
</style></head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCJQ3-MBQ749r2TIOLeCDjVsZDXT7M1ZJo",authDomain:"selah-23ee2.firebaseapp.com",projectId:"selah-23ee2",storageBucket:"selah-23ee2.firebasestorage.app",messagingSenderId:"851173824803",appId:"1:851173824803:web:02fcf7f6b6a91e60071496"};
const CLOUD="dkolr7kmt",PRESET="selah_escuela"; // ← completá estos dos (ver instrucciones)
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),A=$("#app");let me=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=async(c,...q)=>(await getDocs(query(collection(db,c),...q))).docs.map(d=>({id:d.id,...d.data()}));
const up=async f=>{const fd=new FormData();fd.append("file",f);fd.append("upload_preset",PRESET);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`,{method:"POST",body:fd}),j=await r.json();
 if(!j.secure_url)throw Error(j.error?.message||"Error al subir");return{url:j.secure_url,dur:Math.round(j.duration||0)}};
const money=n=>"$ "+Number(n||0).toLocaleString("es-AR");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mm=t=>{const[a,b]=t.split(":");return a*3600+b*60};
const W=o=>Object.assign(window,o);
const ADMIN_EMAIL="siqueirahenrique32@gmail.com";let LG=0;
onAuthStateChanged(auth,async u=>{me=null;let err="";
 if(u){try{const s=await getDoc(doc(db,"users",u.uid));if(s.exists())me={id:u.uid,...s.data()};else if((u.email||"").toLowerCase()===ADMIN_EMAIL){const d={role:"admin",nombre:"Administración",email:u.email};await setDoc(doc(db,"users",u.uid),d);me={id:u.uid,...d}}else err="[v4] Falta el documento users/"+u.uid+" (correo detectado: "+u.email+")"}catch(e){err="[v4] Firestore bloqueó la operación: "+e.message+" — revisá y PUBLICÁ las reglas."}}
 if(u&&!me){alert(err);LG=0;return signOut(auth)}
 const go=me&&(location.hash==="#panel"||LG);LG=0;go?panel():landing()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
let ev;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;$("#inst")?.removeAttribute("hidden")});

/* ---------- LANDING ---------- */
async function landing(){
 document.getElementById("lm")?.remove();location.hash="";
 A.innerHTML=`<nav><img src="logo.png" alt="SELAH"><span></span><a class="ni" href="#insc" onclick="document.getElementById('insc').scrollIntoView()">Inscribite</a>
 <button id="inst" class="o" hidden onclick="ev2()">Instalar app</button><button onclick="loginM()">${me?"Mi panel":"Ingresar"}</button></nav>
 <header class="hero" id="hero"><div class="c"><small>ESCUELA DE MÚSICA</small><h1>Aprendé música<br>en comunidad</h1><p>Clases, instrumentos y mucho oído.</p>
 <a class="b glow" href="#insc" onclick="document.getElementById('insc').scrollIntoView()">Quiero inscribirme</a></div></header>
 <section><h2>Radio SELAH</h2><div class="card radio"><button id="pl" aria-label="Reproducir">▶</button><div><b id="rt">Radio interna de la escuela</b><br><small id="rs">Tocá play para escuchar lo que está sonando ahora.</small></div><audio id="au"></audio></div></section>
 <section><h2>Galería</h2><div class="gal" id="gal"><small>Pronto vas a ver fotos de nuestras clases.</small></div></section>
 <section id="insc"><h2>Inscripción</h2><div class="card"><form id="fi"><label>Nombre completo<input name="n" required></label>
 <label>Edad<input name="e" type="number" min="3" max="99" required></label><label>WhatsApp (con código de área)<input name="w" type="tel" required></label>
 <p>¿Qué instrumentos te interesan?</p><div id="ins"><small>Cargando…</small></div><br><button>Enviar inscripción</button><p id="fm"></p></form></div></section>`;
 W({ev2:()=>ev?.prompt(),loginM});
 const[site,ins]=await Promise.all([list("site"),list("instrumentos")]);
 const sl=site.filter(s=>s.tipo==="slide");$("#hero").insertAdjacentHTML("afterbegin",sl.map((s,i)=>`<div class="sl${i?"":" on"}" style="background-image:url(${esc(s.url)})"></div>`).join(""));
 if(sl.length>1){let i=0;setInterval(()=>{const x=document.querySelectorAll(".sl");x[i].classList.remove("on");i=(i+1)%x.length;x[i].classList.add("on")},5000)}
 const g=site.filter(s=>s.tipo==="gal");if(g.length)$("#gal").innerHTML=g.map(s=>`<img loading="lazy" src="${esc(s.url)}" alt="Foto de SELAH">`).join("");
 $("#ins").innerHTML=ins.map(i=>`<label class="ck"><input type="checkbox" value="${esc(i.nombre)}">${esc(i.nombre)}</label>`).join("")||"<small>Consultanos por los instrumentos disponibles.</small>";
 $("#fi").onsubmit=async e=>{e.preventDefault();const f=e.target;
  try{await addDoc(collection(db,"inscripciones"),{nombre:f.n.value,edad:+f.e.value,whatsapp:f.w.value,instrumentos:[...f.querySelectorAll("#ins input:checked")].map(x=>x.value),estado:"pendiente",fecha:today()});
  f.reset();$("#fm").textContent="¡Listo! Recibimos tu inscripción. Te escribimos por WhatsApp."}catch{$("#fm").textContent="No pudimos enviar. Probá de nuevo."}};
 radio();
}
function loginM(){
 if(me){location.hash="#panel";return panel()}
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="lm"><form class="card" id="lf"><h3>Ingresar</h3><label>Correo<input type="email" name="m" required></label>
 <label>Contraseña<input type="password" name="p" required></label><div class="row"><button>Entrar</button><button type="button" class="o" onclick="lm.remove()">Cancelar</button></div><p id="le" style="color:var(--no)"></p></form></div>`);
 $("#lf").onsubmit=async e=>{e.preventDefault();try{LG=1;await signInWithEmailAndPassword(auth,e.target.m.value,e.target.p.value)}catch(x){LG=0;$("#le").textContent=x.code==="auth/operation-not-allowed"?"Falta activar Correo/contraseña en Firebase Authentication.":x.code==="auth/network-request-failed"?"Sin conexión.":"Correo o contraseña incorrectos ("+x.code+")."}}
}
/* ---------- RADIO ---------- */
async function radio(){
 const au=$("#au"),pl=$("#pl");let on=false;
 async function tune(){
  const s=await getDoc(doc(db,"radio",today()));const L=s.exists()?s.data().slots:[];const n=new Date(),now=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
  const c=L.find(x=>mm(x.inicio)<=now&&now<mm(x.inicio)+x.dur);
  if(!c){$("#rt").textContent="Sin programación en este momento";$("#rs").textContent="Volvé más tarde.";au.pause();setTimeout(()=>on&&tune(),60000);return}
  $("#rt").textContent=c.titulo;$("#rs").textContent="Sonando ahora en SELAH";au.src=c.url;
  au.onloadedmetadata=()=>{au.currentTime=Math.min(now-mm(c.inicio),au.duration||0);au.play()};au.onended=()=>on&&tune()}
 pl.onclick=()=>{on=!on;pl.textContent=on?"❚❚":"▶";on?tune():au.pause()}
}
/* ---------- PANEL ---------- */
function panel(){
 document.getElementById("lm")?.remove();location.hash="#panel";const adm=me.role==="admin";
 const T=adm?["Inscripciones","Instrumentos","Alumnos","Materias","Exámenes","Música","Radio","Sitio"]:[];
 A.innerHTML=`<nav><img src="logo.png" alt="SELAH"><span></span><button class="o" onclick="landing()">Inicio</button><button onclick="signOut_()">Salir</button></nav>
 <section><div class="tabs">${T.map(t=>`<button data-t="${t}">${t}</button>`).join("")}</div><div id="pane"></div></section>`;
 W({landing,signOut_:()=>signOut(auth).then(()=>{me=null;landing()})});
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");P[b.dataset.t]()});
 adm?P.Inscripciones():alumno();
}
const pane=h=>$("#pane").innerHTML=h;
const reload=t=>P[t]();
const stuBox=(all,sel=[])=>all.map(u=>`<label class="ck"><input type="checkbox" name="al" value="${u.id}" ${sel.includes(u.id)?"checked":""}>${esc(u.nombre)}</label>`).join("")||"<small>Todavía no hay alumnos aprobados.</small>";
const checked=f=>[...f.querySelectorAll("[name=al]:checked")].map(x=>x.value);
const P={
async Inscripciones(){const L=await list("inscripciones",where("estado","==","pendiente"));
 pane(`<h2>Inscripciones</h2>`+(L.map(i=>`<div class="card row"><div><b>${esc(i.nombre)}</b>, ${i.edad} años<br><small>${esc(i.whatsapp)} · ${esc((i.instrumentos||[]).join(", "))||"sin instrumento"}</small></div>
 <div><button onclick="apr('${i.id}')">Aprobar</button> <button class="x" onclick="rec('${i.id}')">Rechazar</button></div></div>`).join("")||"<p>No hay inscripciones pendientes.</p>"));
 W({async apr(id){const i=L.find(x=>x.id===id),m=prompt("Correo del alumno para su acceso:"),p=m&&prompt("Contraseña inicial (mín. 6 caracteres):");if(!p)return;
  try{const s=getAuth(initializeApp(cfg,"sec"+Date.now())),c=await createUserWithEmailAndPassword(s,m,p);await signOut(s);
  await setDoc(doc(db,"users",c.user.uid),{role:"student",nombre:i.nombre,edad:i.edad,whatsapp:i.whatsapp,instrumentos:i.instrumentos||[],email:m,beca:false,monto:0,estado:"pendiente",vence:"",alias:"",foto:""});
  await updateDoc(doc(db,"inscripciones",id),{estado:"aprobada"});reload("Inscripciones")}catch(e){alert("No se pudo crear: "+e.message)}},
  async rec(id){await updateDoc(doc(db,"inscripciones",id),{estado:"rechazada"});reload("Inscripciones")}})},
async Instrumentos(){const L=await list("instrumentos");
 pane(`<h2>Instrumentos</h2><form id="f" class="row"><input name="n" placeholder="Ej: Guitarra" required style="flex:1"><button>Agregar</button></form>`+L.map(i=>`<div class="card row">${esc(i.nombre)}<button class="x" onclick="del('instrumentos','${i.id}','Instrumentos')">Eliminar</button></div>`).join(""));
 $("#f").onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,"instrumentos"),{nombre:e.target.n.value});reload("Instrumentos")}},
async Alumnos(){const L=await list("users",where("role","==","student"));
 pane(`<h2>Alumnos</h2>`+L.map(u=>`<form class="card" data-id="${u.id}"><b>${esc(u.nombre)}</b> <small>${esc(u.email)}</small>
 <label class="ck"><input type="checkbox" name="beca" ${u.beca?"checked":""}>Beca (estudia gratis)</label>
 <label>Valor de la cuota<input name="monto" type="number" value="${u.monto||0}"></label>
 <label>Situación<select name="estado"><option value="ok" ${u.estado==="ok"?"selected":""}>Al día</option><option value="pendiente" ${u.estado!=="ok"?"selected":""}>Pendiente</option></select></label>
 <label>Vencimiento de la factura<input name="vence" type="date" value="${u.vence||""}"></label><label>Alias para el pago<input name="alias" value="${esc(u.alias)}"></label><button>Guardar</button></form>`).join("")||"<p>Aún no hay alumnos aprobados.</p>");
 document.querySelectorAll("form[data-id]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();await updateDoc(doc(db,"users",f.dataset.id),{beca:f.beca.checked,monto:+f.monto.value,estado:f.estado.value,vence:f.vence.value,alias:f.alias.value});alert("Guardado")})},
async Materias(){const[L,S]=await Promise.all([list("materias"),list("users",where("role","==","student"))]);
 pane(`<h2>Materias</h2><form id="f" class="card"><label>Nombre<input name="n" required></label><label>Foto de fondo (opcional)<input name="img" type="file" accept="image/*"></label><p>Alumnos que la ven:</p>${stuBox(S)}<br><br><button>Crear materia</button><p id="st"></p></form>`+
 L.map(m=>`<div class="card row"><div><b>${esc(m.nombre)}</b><br><small>${(m.alumnos||[]).length} alumno(s)</small></div><div><button onclick="cont('${m.id}')">Contenido</button> <button class="o" onclick="asig('${m.id}')">Alumnos</button> <button class="x" onclick="del('materias','${m.id}','Materias')">Eliminar</button></div></div>`).join(""));
 $("#f").onsubmit=async e=>{e.preventDefault();const f=e.target;$("#st").textContent="Guardando…";try{const u=f.img.files[0]?(await up(f.img.files[0])).url:"";
  await addDoc(collection(db,"materias"),{nombre:f.n.value,fondo:u,alumnos:checked(f)});reload("Materias")}catch(x){$("#st").textContent=x.message}}},
async Música(){const[L,S]=await Promise.all([list("canciones"),list("users",where("role","==","student"))]);
 pane(`<h2>Música</h2><form id="f" class="card"><label>Título<input name="n" required></label><label>Archivo de audio<input name="a" type="file" accept="audio/*" required></label><p>Destinar a:</p>${stuBox(S)}<br><br><button>Subir canción</button><p id="st"></p></form>`+
 L.map(c=>`<div class="card row"><div>${esc(c.titulo)} <small>${Math.floor(c.dur/60)}:${String(c.dur%60).padStart(2,"0")}</small></div><button class="x" onclick="del('canciones','${c.id}','Música')">Eliminar</button></div>`).join(""));
 $("#f").onsubmit=async e=>{e.preventDefault();const f=e.target;$("#st").textContent="Subiendo… puede tardar.";try{const r=await up(f.a.files[0]);
  await addDoc(collection(db,"canciones"),{titulo:f.n.value,url:r.url,dur:r.dur,para:checked(f)});reload("Música")}catch(x){$("#st").textContent=x.message}}},
async Radio(){const C=await list("canciones");let d=today(),slots=[];
 const load=async()=>{const s=await getDoc(doc(db,"radio",d));slots=s.exists()?s.data().slots:[];draw()};
 const draw=()=>{slots.sort((a,b)=>mm(a.inicio)-mm(b.inicio));const tot=slots.reduce((s,x)=>s+x.dur,0);
  $("#sl").innerHTML=slots.map((x,i)=>`<div class="card row"><div><b>${x.inicio}</b> · ${esc(x.titulo)} <small>${Math.round(x.dur/60)} min</small></div><button class="x" onclick="rm(${i})">Quitar</button></div>`).join("")||"<p>Este día no tiene música todavía.</p>";
  $("#tt").textContent=`Programado: ${Math.floor(tot/3600)} h ${Math.round(tot%3600/60)} min de 24 h`};
 pane(`<h2>Radio</h2><div class="card"><label>Día<input type="date" id="dd" value="${d}"></label><form id="f"><label>Canción<select name="c">${C.map(c=>`<option value="${c.id}">${esc(c.titulo)}</option>`).join("")}</select></label>
 <label>Hora de inicio<input type="time" name="h" required></label><button>Agregar al horario</button></form></div><p id="tt"></p><div id="sl"></div><button id="sv">Guardar el día</button>`);
 $("#dd").onchange=e=>{d=e.target.value;load()};
 $("#f").onsubmit=e=>{e.preventDefault();const c=C.find(x=>x.id===e.target.c.value);if(!c)return;slots.push({inicio:e.target.h.value,titulo:c.titulo,url:c.url,dur:c.dur||180});draw()};
 W({rm:i=>{slots.splice(i,1);draw()}});
 $("#sv").onclick=async()=>{await setDoc(doc(db,"radio",d),{slots});alert("Día guardado")};
 for(const o of await list("radio"))if(o.id<today())deleteDoc(doc(db,"radio",o.id)); // limpieza automática de días pasados
 load()},
async Sitio(){const L=await list("site");
 pane(`<h2>Sitio</h2><form id="f" class="card"><label>Tipo<select name="t"><option value="slide">Imagen del encabezado (slide)</option><option value="gal">Foto de la galería</option></select></label><label>Imagen<input name="i" type="file" accept="image/*" required></label><button>Subir</button><p id="st"></p></form>`+
 L.map(s=>`<div class="card row"><img src="${esc(s.url)}" height="60" alt=""><small>${s.tipo==="slide"?"Slide":"Galería"}</small><button class="x" onclick="del('site','${s.id}','Sitio')">Eliminar</button></div>`).join(""));
 $("#f").onsubmit=async e=>{e.preventDefault();$("#st").textContent="Subiendo…";try{const r=await up(e.target.i.files[0]);await addDoc(collection(db,"site"),{tipo:e.target.t.value,url:r.url});reload("Sitio")}catch(x){$("#st").textContent=x.message}}}
};

let Q=[];
const qh=()=>Q.map((q,i)=>`<div class="card"><div class="row"><b>${i+1}. ${q.tipo==="mc"?"Opción múltiple":"Desarrollo"}</b><button type="button" class="x" onclick="qdel(${i})">Quitar</button></div>
<label>Enunciado<textarea rows="2" oninput="qset(${i},'texto',this.value)">${esc(q.texto)}</textarea></label>`+(q.tipo==="mc"?q.ops.map((o,j)=>`<div class="row" style="flex-wrap:nowrap;gap:.6rem"><input type="radio" name="r${i}" ${q.ok===j?"checked":""} onchange="qset(${i},'ok',${j})" aria-label="Opción correcta" style="width:auto;margin:0"><input value="${esc(o)}" placeholder="Opción ${j+1}" oninput="qset(${i},'ops',this.value,${j})" style="margin:.25rem 0"></div>`).join("")+"<small>Marcá con el círculo la opción correcta.</small>":"")+`</div>`).join("");
const rq=()=>$("#qs").innerHTML=qh();
async function exam(){Q=[];const[L,S,M]=await Promise.all([list("examenes"),list("users",where("role","==","student")),list("materias")]);
 pane(`<h2>Exámenes</h2><form id="fe" class="card"><h3>Crear examen</h3><label>Título<input name="t" required></label>
 <label>Materia (opcional)<select name="m"><option value="">— Sin materia —</option>${M.map(m=>`<option>${esc(m.nombre)}</option>`).join("")}</select></label>
 <p>Alumnos que lo rinden:</p>${stuBox(S)}<div id="qs" style="margin-top:1rem"></div>
 <div class="row" style="margin:.8rem 0;justify-content:flex-start"><button type="button" class="o" onclick="qadd('dis')">+ Pregunta de desarrollo</button><button type="button" class="o" onclick="qadd('mc')">+ Opción múltiple</button></div>
 <button>Publicar examen</button><p id="st"></p></form><h3>Mis exámenes</h3>`+
 (L.map(e=>`<div class="card row"><div><b>${esc(e.titulo)}</b><br><small>${esc(e.materia||"")} · ${e.preguntas.length} pregunta(s) · ${e.alumnos.length} alumno(s)</small></div><div><button onclick="entr('${e.id}')">Entregas y notas</button> <button class="x" onclick="delE('${e.id}')">Eliminar</button></div></div>`).join("")||"<p>Todavía no creaste exámenes.</p>"));
 W({qset:(i,k,v,j)=>{if(k==="ops")Q[i].ops[j]=v;else Q[i][k]=v},qdel:i=>{Q.splice(i,1);rq()},qadd:t=>{Q.push(t==="mc"?{tipo:"mc",texto:"",ops:["","","",""],ok:0}:{tipo:"dis",texto:""});rq()}});
 $("#fe").onsubmit=async e=>{e.preventDefault();const f=e.target,al=checked(f),st=m=>$("#st").textContent=m;
  if(!Q.length)return st("Agregá al menos una pregunta.");if(!al.length)return st("Elegí al menos un alumno.");
  const P_=[],K=[];
  for(const q of Q){if(!q.texto.trim())return st("Completá el enunciado de todas las preguntas.");
   if(q.tipo==="mc"){const ix=q.ops.map((o,j)=>o.trim()?j:-1).filter(j=>j>=0),ok=ix.indexOf(q.ok);
    if(ix.length<2)return st("Cada pregunta de opción múltiple necesita al menos 2 opciones.");if(ok<0)return st("La opción correcta no puede estar vacía.");
    P_.push({tipo:"mc",texto:q.texto,opciones:ix.map(j=>q.ops[j])});K.push(ok)}else{P_.push({tipo:"dis",texto:q.texto});K.push(null)}}
  try{const r=await addDoc(collection(db,"examenes"),{titulo:f.t.value,materia:f.m.value,alumnos:al,preguntas:P_,ts:Date.now()});
   await setDoc(doc(db,"examenes",r.id,"clave","k"),{correctas:K});exam()}catch(x){st(x.message)}}}
async function entr(id){const[ex,E,k]=await Promise.all([getDoc(doc(db,"examenes",id)),list("entregas",where("examen","==",id)),getDoc(doc(db,"examenes",id,"clave","k"))]);
 const e=ex.data(),C=k.exists()?k.data().correctas:[],mcN=e.preguntas.filter(q=>q.tipo==="mc").length;
 pane(`<button class="o" onclick="exam()">← Exámenes</button><h2 style="margin-top:1rem">${esc(e.titulo)}</h2>`+(E.map(x=>{const h=e.preguntas.filter((q,i)=>q.tipo==="mc"&&x.respuestas[i]===C[i]).length;
  return `<form class="card" data-e="${x.id}"><div class="row"><b>${esc(x.nombre)}</b><small>${x.estado==="corregida"?"Nota: "+x.nota:"Pendiente de corrección"}</small></div>`+
  e.preguntas.map((q,i)=>`<p><b>${i+1}. ${esc(q.texto)}</b><br>`+(q.tipo==="mc"?`${x.respuestas[i]!=null?esc(q.opciones[x.respuestas[i]]):"<i>Sin respuesta</i>"} ${x.respuestas[i]===C[i]?"✅":"❌"} <small>(correcta: ${esc(q.opciones[C[i]])})</small>`:`<span style="white-space:pre-wrap">${esc(x.respuestas[i])||"<i>Sin respuesta</i>"}</span>`)+`</p>`).join("")+
  (mcN?`<small>Aciertos en opción múltiple: ${h} de ${mcN}</small>`:"")+

 document.querySelectorAll("form[data-e]").forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();await updateDoc(doc(db,"entregas",f.dataset.e),{nota:+f.n.value,comentario:f.c.value,estado:"corregida"});entr(id)})}
P["Exámenes"]=()=>exam();
W({exam,entr,async delN(x,id){if(confirm("¿Eliminar esta entrega y su nota? No se puede deshacer.")){await deleteDoc(doc(db,"entregas",x));entr(id)}},
 async delE(id){if(confirm("¿Eliminar el examen con todas las entregas y notas? No se puede deshacer.")){for(const x of await list("entregas",where("examen","==",id)))await deleteDoc(doc(db,"entregas",x.id));
